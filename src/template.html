<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Battleship</title>
    <link
      href="https://fonts.googleapis.com/css?family=Press+Start+2P"
      rel="stylesheet"
    />
    <link href="https://unpkg.com/nes.css/css/nes.css" rel="stylesheet" />

    <style>
      * {
        font-family: "Press Start 2P", cursive !important;
      }
    </style>
  </head>
  <body>
    <header>
      <h1 class="nes-text is-primary title">Battleship</h1>
    </header>

    <main class="body-stuff nes-container is-dark with-title">
      <p class="title">Command Center</p>
      <div class="ships-container nes-container is-rounded is-dark">
        <h1>Ships</h1>

        <div class="selection-wrapper">
          <div class="ship-list">
            <div class="ship-4">
              <span>4</span>
              <div class="inner-container 4">
                <div class="ship"></div>
                <div class="ship"></div>
                <div class="ship"></div>
                <div class="ship"></div>
              </div>
            </div>

            <div class="ship-3">
              <span>3</span>
              <div class="inner-container 3">
                <div class="ship"></div>
                <div class="ship"></div>
                <div class="ship"></div>
              </div>
            </div>

            <div class="ship-2">
              <span>2</span>
              <div class="inner-container 2">
                <div class="ship"></div>
                <div class="ship"></div>
              </div>
            </div>

            <div class="ship-1">
              <span>1</span>
              <div class="inner-container 1">
                <div class="ship"></div>
              </div>
            </div>
          </div>

          <div class="global-orientation">
            <span
              >(<span class="horizontal span-option">H</span> /
              <span class="vertical span-option">V</span>)</span
            >
          </div>
        </div>
      </div>
      <div class="mobile-tabs">
        <button class="nes-btn is-primary" id="tab-fleet">My Fleet</button>
        <button class="nes-btn" id="tab-enemy">Enemy Waters</button>
      </div>

      <div class="boards">
        <div class="board-wrapper" id="wrapper-one">
          <h3
            class="nes-text is-primary"
            style="text-align: center; margin-bottom: 1rem"
          >
            Your Fleet
          </h3>
          <div class="board-one"></div>
        </div>
        <div class="board-wrapper mobile-hidden" id="wrapper-two">
          <h3
            class="nes-text is-error"
            style="text-align: center; margin-bottom: 1rem"
          >
            Enemy Waters
          </h3>
          <div class="board-two"></div>
        </div>
      </div>
      <section class="game-buttons">
        <button class="nes-btn is-primary shuffle-btn">Shuffle Ships</button>
        <button class="nes-btn is-primary is-success play-btn">Play</button>
      </section>
    </main>

    <div class="winner-overlay hidden" id="winner-overlay">
      <div class="winner-modal">
        <h2 id="winner-text" class="nes-text title"></h2>
        <p>All enemy ships destroyed.</p>
        <button
          class="nes-btn is-primary play-again-btn"
          onclick="location.reload()"
        >
          Play Again
        </button>
      </div>
    </div>
  </body>
</html>
