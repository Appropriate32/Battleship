<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Battleship</title>
    <link
      href="https://fonts.googleapis.com/css?family=Press+Start+2P"
      rel="stylesheet"
    />
    <link href="https://unpkg.com/nes.css/css/nes.css" rel="stylesheet" />

    <style>
      * {
        font-family: "Press Start 2P", cursive !important;
      }
    </style>
  </head>
  <body>
    <header>
      <h1 class="nes-text is-primary title">Battleship</h1>
    </header>

    <main class="body-stuff">
      <div class="ships-container">
        <h1>Ships</h1>
        <div class="ship-4">
          <span>4</span>
          <div class="inner-container 4">
            <div class="ship"></div>
            <div class="ship"></div>
            <div class="ship"></div>
            <div class="ship"></div>
          </div>
          <span
            >(<span class="horizontal span-option">H</span> /
            <span class="vertical span-option">V</span>)</span
          >
        </div>
        <div class="ship-3">
          <span>3</span>
          <div class="inner-container 3">
            <div class="ship"></div>
            <div class="ship"></div>
            <div class="ship"></div>
          </div>
          <span
            >(<span class="horizontal span-option">H</span> /
            <span class="vertical span-option">V</span>)</span
          >
        </div>
        <div class="ship-2">
          <span>2</span>
          <div class="inner-container 2">
            <div class="ship"></div>
            <div class="ship"></div>
          </div>
          <span
            >(<span class="horizontal span-option">H</span> /
            <span class="vertical span-option">V</span>)</span
          >
        </div>
        <div class="ship-1">
          <span>1</span>
          <div class="inner-container 1">
            <div class="ship"></div>
          </div>
          <span
            >(<span class="horizontal span-option">H</span> /
            <span class="vertical span-option">V</span>)</span
          >
        </div>
      </div>
      <div class="boards">
        <div class="board-one"></div>
        <div class="board-two"></div>
      </div>
    </main>
    <section class="game-buttons">
      <button class="nes-btn is-primary place-btn">Place Ships</button>
      <button class="nes-btn is-primary play-btn">Play</button>
    </section>
  </body>
</html>
